name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: wta_test
          MYSQL_USER: wta
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Throwaway values for the CI database only; nothing here is a real secret.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_TEST_DBNAME: wta_test
      DB_LOCAL_USER: wta
      DB_LOCAL_PASSWORD: ci-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Fail on high or critical vulnerabilities in what the server runs.
      - run: npm audit --omit=dev --audit-level=high

  # Builds the production image and runs it the way a deployment does
  # (migrations, then the API, against MySQL), then signs up through it.
  docker:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the stack
        run: docker compose up -d --build api
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          exit 1
      - name: Sign up, and check the verification email was sent
        run: |
          curl -fsS -X POST http://localhost:8080/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","first_name":"C","last_name":"I","accept_terms":true}'
          for i in $(seq 1 20); do
            total=$(curl -fsS http://localhost:8025/api/v1/messages | jq .total)
            [ "$total" -ge 1 ] && exit 0
            sleep 1
          done
          exit 1
      - name: The development seeds refuse to run in production
        run: |
          if docker compose run --rm -v "$PWD/DB_Setup/seeds:/app/DB_Setup/seeds:ro" api npx knex seed:run; then
            echo "Seeds ran with NODE_ENV=production"; exit 1
          fi
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  # The web app's browser tests (in JDVM/why-travel-alone, e2e/) against this
  # API, the way the frontend's CI runs them. Uses the web app branch with the
  # same name as this one when it exists, so a change that spans both
  # repositories is tested together; otherwise the web app's main.
  e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      TRUST_PROXY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          path: why-travel-alone-api
      - name: Pick the web app branch
        id: web
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/JDVM/why-travel-alone.git "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          repository: JDVM/why-travel-alone
          ref: ${{ steps.web.outputs.ref }}
          path: why-travel-alone
      - name: Start the stack (web app branch ${{ steps.web.outputs.ref }})
        working-directory: why-travel-alone-api
        run: docker compose --profile web up -d --build
      - uses: actions/setup-node@v6
        with:
          node-version-file: why-travel-alone/.nvmrc
          cache: npm
          cache-dependency-path: why-travel-alone/package-lock.json
      - run: npm ci
        working-directory: why-travel-alone
      - run: npx playwright install --with-deps chromium
        working-directory: why-travel-alone
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && curl -fsS http://localhost:3000/healthz && exit 0
            sleep 2
          done
          exit 1
      - run: npx playwright test
        working-directory: why-travel-alone
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: why-travel-alone/playwright-report
          retention-days: 7
      - name: Logs
        if: failure()
        working-directory: why-travel-alone-api
        run: docker compose --profile web logs
