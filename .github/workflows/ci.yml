name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: wta_test
          MYSQL_USER: wta
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Throwaway values for the CI database only; nothing here is a real secret.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_TEST_DBNAME: wta_test
      DB_LOCAL_USER: wta
      DB_LOCAL_PASSWORD: ci-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Fail on high or critical vulnerabilities in what the server runs.
      - run: npm audit --omit=dev --audit-level=high
