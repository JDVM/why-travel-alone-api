# A production-like stack on one machine: MySQL, the migrations, the API and
# a mail catcher, all built and configured the way a real deployment is.
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#
# API: http://localhost:8080    Emails sent: http://localhost:8025
#
# With the frontend checked out next to this repo (../why-travel-alone), add
# the web app on http://localhost:3000:
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose --profile web up --build
#
# This file is for trying the deployment locally and for CI. The passwords
# below are local-only defaults; a real deployment sets its own (DEPLOYMENT.md).

x-api-environment: &api-environment
  NODE_ENV: production
  DB_HOST: db
  DB_PORT: 3306
  DB_LOCAL_DBNAME: wta
  DB_LOCAL_USER: wta
  DB_LOCAL_PASSWORD: ${DB_PASSWORD:-local-only-db-password}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -hex 32)}
  CORS_ORIGIN: http://localhost:3000
  APP_URL: http://localhost:3000
  # Mailpit catches every email instead of delivering it. It has no TLS, so
  # TLS is switched off here only.
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_REQUIRE_TLS: "false"
  MAIL_FROM: Why Travel Alone <no-reply@localhost>
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wta
      MYSQL_USER: wta
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-only-db-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-only-root-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Runs once before the API starts, like a release step on a hosting platform.
  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *api-environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  web:
    profiles: ["web"]
    build:
      context: ../why-travel-alone
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080
    environment:
      API_ORIGIN: http://localhost:8080
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  db-data:
